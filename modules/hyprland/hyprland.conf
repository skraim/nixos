source = ./colors.conf

################
### MONITORS ###
################

monitor=eDP-1,1920x1200,0x0,1.2
monitor=desc:Xiaomi Corporation Mi Monitor,3440x1440@100Hz,1600x-50,auto

#################
### AUTOSTART ###
#################

exec-once = dbus-update-activation-environment --all --systemd
exec-once = hypridle & udiskie & hyprsunset & ydotoold
exec-once = systemctl --user start hyprpolkitagent
exec-once = quickshell
exec-once = matugen image "$(find ~/Pictures/wallpapers -type f | shuf -n 1)" --source-color-index $((RANDOM % 2))
exec-once = Telegram
exec-once = hyprctl setcursor Bibata-Original-Ice 28
exec-once = hyprland-per-window-layout
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = wl-clip-persist --clipboard regular
exec-once = rm "$HOME/.cache/cliphist/db"
exec-once = brightnessctl -s set 50%
exec-once = gnome-keyring-daemon --start --components=secrets

#############################
### ENVIRONMENT VARIABLES ###
#############################

env = HYPRCURSOR_THEME,Bibata-Original-Ice
env = HYPRCURSOR_SIZE,28
env = XCURSOR_THEME,Bibata-Original-Ice
env = XCURSOR_SIZE,28
env = WLR_DRM_NO_ATOMIC,1
env = EDITOR,nvim
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = SLURP_ARGS,-b$background77 -c$primary -w1

#####################
### LOOK AND FEEL ###
#####################

general { 
    gaps_out = 10
    border_size = 2
    col.active_border = rgba($secondaryee) rgba($primaryee) 45deg
    col.inactive_border = rgba($shadowee)
    resize_on_border = false 
    allow_tearing = true
    layout = scrolling
}

decoration {
    rounding = 5
    active_opacity = 1
    inactive_opacity = 1
    fullscreen_opacity = 1

    blur {
        size = 1
        passes = 3
        contrast = 1.2 
        brightness = 0.9
    }

    shadow {
        range = 7
    }
}

animations {
    enabled = true
    bezier = myBezier, 0.075, 0.82, 0.165, 1

    animation = layers, 0
    animation = windows, 1, 2, myBezier
    animation = windowsOut, 1, 2, default, popin 80%
    animation = border, 1, 5, default
    animation = fade, 1, 2, default
    animation = workspaces, 1, 2, default, slidefadevert 50%
    animation = specialWorkspace, 1, 5, default, fade
}

scrolling {
    column_width = 0.4925
    explicit_column_widths = 0.32833, 0.4925, 0.6566, 0.985
}

xwayland {
    force_zero_scaling = true
}

misc { 
    disable_hyprland_logo = true
    animate_manual_resizes = true
    animate_mouse_windowdragging = true
    on_focus_under_fullscreen = 2
    disable_splash_rendering = true
    key_press_enables_dpms = true
    mouse_move_enables_dpms = true
}


#############
### INPUT ###
#############

input {
    kb_layout = us,ua-graph-rev
    kb_options = grp:caps_toggle
    repeat_delay = 250
    follow_mouse = 1

    touchpad {
        natural_scroll = true
        scroll_factor = 0.2
    }
}

cursor {
    inactive_timeout = 20
}

debug {
    disable_logs = false
}

ecosystem {
    no_donation_nag = true
}

##############
### PLUGIN ###
##############

binds {
    movefocus_cycles_fullscreen = true
    allow_pin_fullscreen = true
    # If enabled, apps that request keybinds to be disabled (e.g. VMs) will not be able to do so.
    disable_keybind_grabbing = true
}

render {
    # Enables direct scanout. Direct scanout attempts to reduce lag when there is only one fullscreen application on a screen (e.g. game).
    # It is also recommended to set this to false if the fullscreen application shows graphical glitches.
    # 0 - off, 1 - on, 2 - auto (on with content type ‘game’)
    direct_scanout = 1
}

####################
### KEYBINDINGSS ###
####################

$mainMod = SUPER

bind = $mainMod SHIFT, Q, exec, qs ipc call powermenu toggle
bind = $mainMod, RETURN, exec, kitty
bind = $mainMod, B, exec, qs ipc call whichkey toggle browser
bind = $mainMod SHIFT, C, exec, qs ipc call whichkey toggle window
bind = $mainMod, F, fullscreen, 1
bind = $mainMod SHIFT, F, fullscreen
bind = $mainMod, P, pin, active,
bind = $mainMod, V, togglefloating,
bind = $mainMod, Q, exec, qs ipc call whichkey toggle bar
bind = $mainMod, Space, exec, qs ipc call launcher toggle; hyprctl switchxkblayout current 0
bind = $mainMod SHIFT, Space, exec, qs ipc call run toggle; hyprctl switchxkblayout current 0
bind = $mainMod SHIFT, comma, movecurrentworkspacetomonitor, +1
bind = $mainMod SHIFT, V, exec, qs ipc call cliphist toggle; hyprctl switchxkblayout current 0
bind = $mainMod SHIFT, P, exec, qs ipc call whichkey toggle picker
bind = , PRINT, exec, qs ipc call whichkey toggle screen

bind = $mainMod, A, movefocus, u
bind = $mainMod, H, movefocus, d
bind = $mainMod, Tab, cyclenext
bind = $mainMod, Tab, alterzorder, top

bind = $mainMod, Up, movefocus, u
bind = $mainMod, Down, movefocus, d

bind = $mainMod, bracketright, movewindow, r
bind = $mainMod, bracketleft, movewindow, l
bind = $mainMod SHIFT, A, movewindow, u
bind = $mainMod SHIFT, H, movewindow, d

bind = $mainMod SHIFT, Up, movewindow, u
bind = $mainMod SHIFT, Down, movewindow, d

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod, N, exec, notify-send "test"

bind = $mainMod, S, togglespecialworkspace
bind = $mainMod SHIFT, S, movetoworkspace, special

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bindel=,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindel=,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel=SHIFT,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SOURCE@ 5%+
bindel=SHIFT,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SOURCE@ 5%-
bindl=,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl=SHIFT,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl=,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel=,XF86MonBrightnessDown, exec, hyprctl hyprsunset gamma -10
bindel=,XF86MonBrightnessUp, exec, hyprctl hyprsunset gamma +10
bindl=,XF86AudioPlay, exec, playerctl play-pause
bindl=,XF86AudioNext, exec, playerctl next
bindl=,XF86AudioPrev, exec, playerctl previous

bindl=,switch:on:Lid Switch, exec, hyprctl keyword monitor "eDP-1,disable"
bindl=,switch:off:Lid Switch, exec, hyprctl keyword monitor "eDP-1,1920x1200,0x0,1.2"

bind=$mainMod SHIFT, R,submap,resize
submap=resize
binde=,E,resizeactive,20 0
binde=,Y,resizeactive,-20 0
binde=,H,resizeactive,0 -20
binde=,A,resizeactive,0 20
binde=,Right,resizeactive,20 0
binde=,Left,resizeactive,-20 0
binde=,Down,resizeactive,0 -20
binde=,Up,resizeactive,0 20
bind = , catchall, submap, reset
submap=reset

bind=$mainMod,M,submap,move
submap=move
binde=,E,moveactive,30 0
binde=,Y,moveactive,-30 0
binde=,H,moveactive,0 30
binde=,A,moveactive,0 -30
binde=,Right,moveactive,30 0
binde=,Left,moveactive,-30 0
binde=,Down,moveactive,0 30
binde=,Up,moveactive,0 -30
bind = , catchall, submap, reset
submap=reset

#hyprcsrolling binds
bind = $mainMod, R, layoutmsg, colresize +conf
bind = $mainMod SHIFT, E, layoutmsg, swapcol r
bind = $mainMod SHIFT, Y, layoutmsg, swapcol l
bind = $mainMod, E, layoutmsg, focus r
bind = $mainMod, Y, layoutmsg, focus l
bind = $mainMod SHIFT, Right, layoutmsg, swapcol r
bind = $mainMod SHIFT, Left, layoutmsg, swapcol l
bind = $mainMod, Right, layoutmsg, focus r
bind = $mainMod, Left, layoutmsg, focus l
bind = $mainMod, C, layoutmsg, togglefit

windowrule = suppress_event maximize
windowrule = workspace 1, match:class [lL]ibrewolf
windowrule = workspace 2, match:class kitty
windowrule = workspace 3, match:class [cC]hromium.*
windowrule = workspace 4, match:class org.telegram.desktop, match:initial_title ^Telegram$
windowrule = workspace 4, match:class Slack
windowrule = workspace 4, match:class ZapZap
windowrule = workspace 5, match:class jetbrains-.*, match:float false
windowrule = workspace 6, match:class teams-for-linux
windowrule = workspace 7, match:class OrcaSlicer, match:float false
windowrule = workspace 7, match:class org.freecad.FreeCAD, match:float false
windowrule = workspace 8, match:class steam
windowrule = workspace 10, match:class [sS]potify
windowrule = float on, center on, size (monitor_w*0.5) (monitor_h*0.8), match:class xdg\-desktop\-portal\-gtk, match:initial_title All Files
windowrule = float on, center on, size (monitor_w*0.6) (monitor_h*0.8), match:class org\.gnome\.Loupe
windowrule = opacity 0.95 0.9 0.95, no_screen_share on, match:class org.telegram.desktop
windowrule = opacity 1, match:class org.telegram.desktop, match:title Media viewer
windowrule = opacity 1, float on, match:class org.telegram.desktop, match:initial_title ^TelegramDesktop$
windowrule = opacity 0.85 0.75 0.85, match:class kitty
windowrule = opacity 0.9, match:class thunar
windowrule = float on, size monitor_w*0.3 monitor_h*0.8, center on, opacity 0.85, match:class org.pulseaudio.pavucontrol
windowrule = opacity 0.9, match:class [sS]potify
windowrule = float on, center on, match:class thunar, match:title File Operation Progress
windowrule = float on, pin on, size 960 540, move monitor_w-970 monitor_h-550, keep_aspect_ratio on, no_initial_focus on, match:title Picture[- ]in[- ]?[Pp]icture
windowrule = no_initial_focus on, no_follow_mouse on, match:class jetbrains-.*, match:float true
windowrule = match:class steam_app_881100, immediate yes
windowrule = match:fullscreen true, rounding 15
workspace = s[true], gapsin:30, gapsout:50
workspace = f[1], gapsin:0, gapsout:0
